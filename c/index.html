<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하늘컴퍼니 온라인 근로계약서</title>
<meta name="description" content="근로계약서 작성 링크입니다. 내용을 확인 후 작성해 주세요.">
<meta property="og:title" content="하늘컴퍼니 온라인 근로계약서">
<meta property="og:description" content="근로계약서 작성 링크입니다. 내용을 확인 후 작성해 주세요.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://skyjob.co.kr/images/skyjob-contract-preview.png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1024">
<style>
body{font-family:"Malgun Gothic",Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
.wrap{max-width:520px;margin:18vh auto;padding:28px;text-align:center}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 12px}p{line-height:1.6;color:#596579}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>하늘컴퍼니 온라인 근로계약서</h1>
<p id="msg">근로계약서로 이동 중입니다...</p>
</div></div>
<script>
(function(){
  const k=(new URLSearchParams(location.search).get('k')||'').toLowerCase();
  const msg=document.getElementById('msg');
  if(!/^[0-9a-f]{16}$/.test(k)){
    msg.textContent='유효하지 않은 근로계약 링크입니다.';
    return;
  }
  const cb='__contractShort_'+Date.now().toString(36);
  const timer=setTimeout(function(){
    cleanup();
    msg.textContent='근로계약 서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
  },12000);
  function cleanup(){
    clearTimeout(timer);
    try{delete window[cb];}catch(_){window[cb]=undefined;}
    if(script.parentNode)script.parentNode.removeChild(script);
  }
  window[cb]=function(d){
    if(!d||!d.ok||!d.token){
      cleanup();
      msg.textContent=(d&&d.message)||'유효하지 않거나 만료된 계약 링크입니다.';
      return;
    }
    const token=d.token;
    cleanup();
    location.replace('/employment-contract.html?mode=sign&token='+encodeURIComponent(token));
  };
  const script=document.createElement('script');
  script.src='https://script.google.com/macros/s/AKfycby6H1liSsSY6fsOWHyFXbEZjrFa9BKj_GushwqN6fTanWINxUAZisIAkTlfqKiidZiT/exec?action=resolveShort&k='+encodeURIComponent(k)+'&callback='+encodeURIComponent(cb);
  script.onerror=function(){
    cleanup();
    msg.textContent='근로계약 서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
