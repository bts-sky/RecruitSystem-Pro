<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하늘컴퍼니 온라인 근로계약서</title>
<meta name="description" content="근로계약서 작성 링크입니다. 내용을 확인 후 작성해 주세요.">
<meta property="og:title" content="하늘컴퍼니 온라인 근로계약서">
<meta property="og:description" content="근로계약서 작성 링크입니다. 내용을 확인 후 작성해 주세요.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://skyjob.co.kr/images/skyjob-preview.png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1024">
</head>
<body>
<p>근로계약서로 이동 중입니다...</p>
<script>
(function(){
  const k=new URLSearchParams(location.search).get('k')||'';
  if(!/^[A-Za-z0-9_-]{8,64}$/.test(k)){
    document.body.innerHTML='<p>유효하지 않은 근로계약 링크입니다.</p>';
    return;
  }
  location.replace('/employment-contract.html?mode=sign&token='+encodeURIComponent(k));
})();
</script>
</body>
</html>
