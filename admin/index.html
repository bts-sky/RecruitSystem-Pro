<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>하늘컴퍼니 지원자 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="login-card">
      <div class="brand-mark">H</div>
      <p class="eyebrow">RECRUIT SYSTEM PRO</p>
      <h1>지원자 관리자</h1>
      <p class="subtext">관리자 비밀번호를 입력해 주세요.</p>
      <form id="loginForm">
        <label for="password">관리자 비밀번호</label>
        <div class="password-row">
          <input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호 입력">
          <button type="button" id="togglePassword" class="secondary">보기</button>
        </div>
        <button type="submit" id="loginButton" class="primary">로그인</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
      <a class="back-link" href="../index.html">← 입사지원서로 돌아가기</a>
    </section>

    <section id="dashboardView" class="dashboard" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">하늘컴퍼니</p>
          <h1>지원자 관리</h1>
        </div>
        <div class="topbar-actions">
          <a class="nav-button contract-admin-link" href="../contract-admin/">근로계약 관리</a>
          <button id="logoutButton" class="secondary">로그아웃</button>
        </div>
      </header>

      <section class="stats" aria-label="지원자 현황">
        <article><span>전체</span><strong id="totalCount">0</strong></article>
        <article><span>신규</span><strong id="newCount">0</strong></article>
        <article><span>면접예정</span><strong id="interviewCount">0</strong></article>
        <article><span>합격</span><strong id="passCount">0</strong></article>
      </section>

      <section class="toolbar">
        <label class="search-box" for="searchInput">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="이름, 연락처, 접수번호 검색">
        </label>
        <label for="statusFilter">
          <span>상태</span>
          <select id="statusFilter">
            <option value="">전체 상태</option>
            <option>신규</option><option>연락완료</option><option>면접예정</option><option>합격</option><option>불합격</option>
          </select>
        </label>
        <button id="refreshButton" class="secondary">새로고침</button>
      </section>

      <p id="dashboardMessage" class="message" aria-live="polite"></p>
      <div id="applicantList" class="applicant-list"></div>
      <div id="emptyState" class="empty" hidden>조건에 맞는 지원자가 없습니다.</div>
      <footer>V1.2.0 · 지원자 수정 및 삭제</footer>
    </section>

    <section id="editModal" class="edit-modal" hidden aria-hidden="true">
      <div class="edit-backdrop" data-close-edit></div>
      <div class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="editTitle">
        <div class="edit-head">
          <div>
            <p class="eyebrow">지원서 내용 수정</p>
            <h2 id="editTitle">지원자 수정</h2>
          </div>
          <button type="button" id="editCloseButton" class="secondary">닫기</button>
        </div>
        <form id="editForm" class="edit-form">
          <input type="hidden" id="editUuid">
          <input type="hidden" id="editReceipt">
          <label><span>성명</span><input id="editName" required></label>
          <label><span>휴대전화</span><input id="editPhone" required></label>
          <label><span>생년월일</span><input id="editBirthDate" type="date"></label>
          <label><span>만 나이</span><input id="editAge" inputmode="numeric"></label>
          <label><span>성별</span><select id="editGender"><option value="">선택</option><option>남성</option><option>여성</option></select></label>
          <label class="wide"><span>주소</span><input id="editAddress"></label>
          <label><span>비상연락처</span><input id="editEmergencyPhone"></label>
          <label><span>건강상태</span><select id="editHealthStatus"><option value="">선택</option><option>양호</option><option>비양호</option></select></label>
          <label class="wide"><span>병력 및 특이사항</span><textarea id="editMedicalHistory" rows="3"></textarea></label>
          <label><span>희망근무형태</span><select id="editWorkType"><option value="">선택</option><option>주간</option><option>야간</option><option>교대</option></select></label>
          <label><span>출퇴근방법</span><select id="editCommuteType"><option value="">선택</option><option>자차</option><option>통근버스</option><option>대중교통</option><option>도보</option></select></label>
          <label class="wide"><span>통근버스 탑승위치</span><input id="editShuttleLocation"></label>
          <label><span>출근가능일</span><input id="editAvailableStartDate" type="date"></label>
          <label class="wide"><span>추가요청사항</span><textarea id="editWorkConditionNote" rows="3"></textarea></label>
          <p class="edit-note wide">사진·서명·첨부파일은 그대로 유지되며, 수정 저장 시 PDF가 자동 재생성됩니다.</p>
          <p id="editMessage" class="message wide" aria-live="polite"></p>
          <div class="edit-actions wide">
            <button type="button" id="editCancelButton" class="secondary">취소</button>
            <button type="submit" id="editSaveButton" class="primary">수정 저장</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="../js/config.js?v=20260804-delete1"></script>
  <script src="admin.js?v=20260804-delete1"></script>
</body>
</html>
